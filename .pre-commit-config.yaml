repos:
  # Python code formatting
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        files: ^_tests/.*\.py$

  # Python linting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        files: ^_tests/.*\.py$
        args: [--fix]

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  # Jekyll build check (fast, no server needed)
  # Skipped in CI - use GitHub Actions workflow instead
  - repo: local
    hooks:
      - id: jekyll-build
        name: Jekyll Build Check
        # Skip only when bundle is missing; a failed build must fail the hook.
        entry: bash -c 'if ! command -v bundle >/dev/null; then echo "Skipping Jekyll build (bundle not found)"; exit 0; fi; bundle exec jekyll build --drafts --source docs --destination docs/_site'
        language: system
        pass_filenames: false
        files: \.(md|html|yml|yaml|css|js)$

      # Drafts are local-only (see _documentation/workflow.md); this is the backstop.
      - id: no-drafts
        name: Keep drafts out of commits
        entry: Drafts are local-only; unstage anything under docs/_drafts/
        language: fail
        files: ^docs/_drafts/
