# Version updates, grouped to one PR per ecosystem per month. Security
# updates are separate and arrive as soon as an advisory lands.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]

  # github-pages pins Jekyll and its plugins to what Pages builds with.
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: monthly
    groups:
      ruby:
        patterns: ["*"]
