# Runs the same sealed suite as `make test`, in the same image.
name: test

on:
  # Branch pushes are covered by their pull request; only master runs on push.
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels its stale run; master runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # ubuntu-24.04 ships Podman 4.9.3 (actions/runner-images#14642).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build the dev image
        run: make build
      - name: Sync the venv volume (networked)
        run: make sync IT=
      - name: Run the suite sealed offline
        run: make test IT=
