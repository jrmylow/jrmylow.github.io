# Runs the pre-commit hooks over every file, so a commit made without them
# installed still gets checked. The Jekyll build hook is skipped: the test
# workflow builds the site in the container.
name: lint

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - name: Check uv.lock matches pyproject.toml
        run: uv lock --check
      - uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit
        env:
          SKIP: jekyll-build
        run: uv run --frozen --only-group dev pre-commit run --all-files --show-diff-on-failure
