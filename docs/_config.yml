# Setup
title:               Jeremy Low
tagline:             'Ruminations...'
description:         'A home for essays. Written by <a href="https://twitter.com/jrmy_low" >@jrmy_low</a>. <br><br>To get in touch, please check out the contact page below.'
disclaimer:          "Opinions my own. I do not speak for my employer, nor yours. None of this is financial advice."
url:                 "https://jrmylow.com"
baseurl:             ''
paginate:            10
paginate_path:       "/essays/all/page/:num/"
permalink:           pretty

# Collections
collections:
  previews:
    output: true
    permalink: /:year/:month/:day/:title/

# Defaults
defaults:
  - scope:
      path: ""
      type: previews
    values:
      layout: post

# Include directories
include: ['_pages']

# About/contact
author:
  name:             Jeremy Low
  twitter:          jrmy_low        # seo-tag reads this for twitter:creator
  tw_url:           jrmy_low        # used by the contact page link
  gh_url:           jrmylow
  md_url:           '@jrmylow@mastodon.world'
  email:            hello@jrmylow.com
  hn_url:           jrmylow

# jekyll-seo-tag social defaults
twitter:
  username: jrmy_low
  card:     summary

# Gems
plugins:
  - jekyll-paginate
  - jekyll-seo-tag

kramdown:
  auto_ids: true
  auto_id_stripping: false
  toc_levels: 1..6

# Custom vars
theme_name:          Lanyon
theme_url:           https://lanyon.getpoole.com/
theme_version:       1.1.0
destination: _site
